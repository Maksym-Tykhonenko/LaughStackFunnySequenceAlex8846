workflows:
  ios-workflow:
    name: 'Stack Laugh Funny Sequence'
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: StackFunnySequenceApiKeyNew
    environment:
      xcode: '26.0'
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.lkasdkl.asdkldsfk
      vars:
        BUNDLE_ID: com.lkasdkl.asdkldsfk
        XCODE_WORKSPACE: LaughStackFunnySequence.xcworkspace
        XCODE_SCHEME: LaughStackFunnySequence
        APP_STORE_APPLE_ID: 6776123837
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Clean Pods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Set up provisioning profile settings on  Xcode project
        script: |
          cd ios
          xcode-project use-profiles
      - name: Set version and build number
        script: |
          cd ios
      
          # Version (CFBundleShortVersionString)
          agvtool new-marketing-version 1.0.3
      
          # Build (CFBundleVersion)
          agvtool new-version -all 5
      - name: Build IPA for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData//Build//*.app
      - $HOME/Library/Developer/Xcode/DerivedData//Build//*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_app_store: true
        copyright: 'CLIM JUNAID'
